# Nginx reverse proxy configuration for Munim AI
# Place in: /etc/nginx/sites-available/munim-ai
# Then symlink to: /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g., munim.yourdomain.com) or keep _ for IP address access

    # Max upload size for invoice/receipt OCR images (up to 25MB)
    client_max_body_size 25M;

    # Gzip compression for fast loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # WebSocket support (for Vite HMR in dev or real-time streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for longer AI LLM reasoning streams
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
